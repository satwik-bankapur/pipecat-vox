[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-vox"
version = "0.1.0"
description = "timepay.ai Vox text-to-speech for Pipecat"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [{ name = "Satwik Bankapur" }]
dependencies = ["pipecat-ai>=1.15.0", "websockets>=13"]

[project.optional-dependencies]
demo = ["redis>=5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["pipecat_vox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "B", "UP"]
